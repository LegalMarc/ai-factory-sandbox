[project]
name = "wordstats"
version = "0.1.0"
description = "Count word frequencies across text files."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wordstats = "wordstats.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wordstats"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["wordstats", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
